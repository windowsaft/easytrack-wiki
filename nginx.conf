server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The wiki lives under /docs; send the bare root there.
    location = / {
        return 302 /docs/;
    }

    location /docs/ {
        try_files $uri $uri/ /docs/404.html;
    }

    error_page 404 /docs/404.html;
}
