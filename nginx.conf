server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Relative redirects only: behind the HTTPS reverse proxy, an absolute redirect
    # would leak the container's host:port or downgrade the scheme to http.
    absolute_redirect off;

    # Bare /docs (no trailing slash) → normalise to /docs/.
    location = /docs {
        return 301 /docs/;
    }

    # The built site lives under /usr/share/nginx/html/docs/. NPM strips the /docs prefix,
    # so requests arrive at the root — re-prepend /docs. Directory (trailing-slash) forms are
    # tried first so page URLs resolve to their index.html without a stray 301. The plain
    # /docs$uri last catches asset files. Works too if the prefix is ever kept ($uri first).
    location / {
        try_files $uri $uri/ /docs$uri/ /docs$uri =404;
    }

    error_page 404 /docs/404.html;
}
